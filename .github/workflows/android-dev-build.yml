name: Fast Dev Android Build
on:
  push:
    branches:
      - fix-foxy-auth-jni
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fetch VPN engines
        run: ./tools/get-cores.sh android
      - name: Check the engines
        run: ls -l app/libs/zedcore.aar
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
