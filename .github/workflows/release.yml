name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        id: v
        run: |
          v=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)
          echo "name=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  desktop:
    needs: version
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

  publish:
    needs: [version, android, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android-apks, path: dist }
      - uses: actions/download-artifact@v4
        with: { pattern: "desktop-*", path: dist, merge-multiple: true }
      - name: One draft with every platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V='${{ needs.version.outputs.name }}'
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "ZedSecure $V" --notes "" --draft || true
